name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Only cost.py, stats.py and the API client's pure helpers are tested; the rest needs a Home Assistant instance.
      # pandas as pinned by Home Assistant (homeassistant/package_constraints.txt), not the latest.
      - run: uvx --with pandas==2.3.3 --with aiohttp --with pyjwt pytest tests/
